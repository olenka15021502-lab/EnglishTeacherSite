2,'0');if(seconds>=180)stopRecording()}function setStatus(t){$('recStatus').textContent=t}async function startRecording(){if(running)return;if(!window.lamejs){setStatus('MP3 encoder could not load. Check your internet connection and try again.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});context=new (window.AudioContext||window.webkitAudioContext)();input=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(4096,1,1);chunks=[];processor.onaudioprocess=e=>{if(running)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));e.outputBuffer.getChannelData(0).fill(0)};input.connect(processor);const silentOutput=context.createGain();silentOutput.gain.value=0;processor.connect(silentOutput);silentOutput.connect(context.destination);running=true;stoppedAt=null;started=performance.now();clearInterval(timer);timer=setInterval(clock,200);$('start').disabled=true;$('stop').disabled=false;$('again').disabled=true;$('player').hidden=true;$('download').hidden=true;setStatus('Recording…')}catch(e){setStatus('Microphone access failed. Use HTTPS or localhost and allow microphone access.')}}async function stopRecording(){if(!running)return;running=false;stoppedAt=performance.now();clearInterval(timer);timer=null;const elapsed=Math.min(180,Math.floor((stoppedAt-started)/1000));$('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');$('stop').disabled=true;processor.onaudioprocess=null;processor.disconnect();input.disconnect();stream.getTracks().forEach(t=>t.stop());let rate=context.sampleRate;await context.close();setStatus('Encoding MP3…');await new Promise(r=>setTimeout(r,30));try{const encoder=new lamejs.Mp3Encoder(1,rate,128),mp3=[];for(let data of chunks){let pcm=new Int16Array(data.length);for(let i=0;i<data.length;i++){let x=Math.max(-1,Math.min(1,data[i]));pcm[i]=x<0?x*32768:x*32767}let

15px}\n #modalBody .columns ul{padding-left:20px!important}\n}\n</style></head><body><main class=\"wrap\"><header class=\"head\"><div class=\"heading-plaque\"><h1>Exam Practice</h1><div class=\"speaking-row\"><span class=\"speaking-rule\" aria-hidden=\"true\"></span><p class=\"speaking-subtitle\">SPEAKING</p><span class=\"speaking-rule\" aria-hidden=\"true\"></span></div></div><a class=\"back-link\" href=\"index.html\" aria-label=\"Back to all variants\" title=\"Back to all variants\">← Back</a></header><nav class=\"bar\"><button class=\"btn\" data-info=\"criteria\">Criteria</button><button class=\"btn\" data-info=\"language\">Useful Language</button><button class=\"btn\" data-info=\"pros\">Pros &amp; Cons</button></nav><img class=\"sheet\" src=\"__IMAGE__\" alt=\"Speaking Task 4: 01, task illustration and two photographs\"><div class=\"bar\"><button class=\"btn\" id=\"sampleBtn\">Sample Answer</button><button class=\"btn primary\" id=\"recordBtn\">Record Your Answer</button></div><section id=\"sample\" class=\"panel\" hidden><h2>Complete the sample answer</h2><p class=\"muted\">Choose a word, then click a gap. Click a filled gap to remove its word. There are exactly 10 gaps.</p><div id=\"bank\" class=\"bank\"></div><div id=\"answer\" class=\"answer\"></div><div class=\"actions\"><button class=\"btn primary\" id=\"check\">Check My Answer</button><button class=\"btn\" id=\"retry\">Try Again</button></div><div class=\"status\" id=\"feedback\" aria-live=\"polite\"></div></section><section id=\"record\" class=\"panel\" hidden><h2>Record your answer</h2><p class=\"muted\">Maximum recording time: 4 minutes. Your recording is not saved if you close this page.</p><div id=\"clock\" class=\"time\">00:00</div><div class=\"actions\"><button class=\"btn primary\" id=\"start\">Start Recording</button><button class=\"btn\" id=\"stop\" disabled>Stop Recording</button><button class=\"btn\" id=\"again\" disabled>Record Again</button></div><div class=\"status\" id=\"recStatus\" aria-live=\"polite\"></div><audio id=\"player\" class=\"audio\" controls hidden></audio><a id=\"download\" class=\"btn\" download=\"__DOWNLOAD__\" hidden>Download MP3</a></section></main><div class=\"modal\" id=\"modal\" hidden><div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\"><div class=\"dialog-head\"><h2 id=\"modalTitle\"></h2><button class=\"close\" id=\"close\">Close ×</button></div><div id=\"modalBody\"></div></div></div><script src=\"https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js\"><\/script><script>\nconst {source,gapWords,info}=window.TASK_DATA;const $=id=>document.getElementById(id);const sample=$('sample'),record=$('record');function show(which){sample.hidden=which!=='sample';record.hidden=which!=='record';$('sampleBtn').classList.toggle('active',which==='sample');$('recordBtn').classList.toggle('active',which==='record');if(which==='record'&&running){/* keep current recording running */}if(which==='sample'&&running){alert('Stop recording before opening the sample answer.');show('record');return}$(which).scrollIntoView({behavior:'smooth',block:'start'})}$('sampleBtn').onclick=()=>show('sample');$('recordBtn').onclick=()=>show('record');document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{let d=info[b.dataset.info];$('modalTitle').textContent=d.title;$('modalBody').innerHTML=d.html;$('modalBody').scrollTop=0;$('modal').hidden=false;document.body.classList.add('modal-open')});function closeModal(){$('modal').hidden=true;document.body.classList.remove('modal-open')}$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});\nlet selected=null,slots=Array(10).fill(null),checked=false;const parts=source.split(/\\n\\s*\\n/);let counter=0;const usedGapIds=new Set();const tokenized=parts.map(par=>par.replace(new RegExp('\\\\b('+gapWords.map(w=>w.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')).join('|')+')\\\\b','gi'),m=>{let id=gapWords.findIndex(w=>w.toLowerCase()===m.toLowerCase());if(usedGapIds.has(id))return m;usedGapIds.add(id);return '<button class=\"gap\" data-gap=\"'+id+'\" aria-label=\"Gap '+(id+1)+'\">'+(id+1)+'</button>'}));function draw(){const shuffled=[...gapWords].map((w,i)=>({w,i})).sort((a,b)=>a.w.localeCompare(b.w));$('bank').innerHTML=shuffled.map(({w,i})=>'<button class=\"word '+(slots.includes(i)?'used ':'')+(selected===i?'chosen':'')+'\" data-word=\"'+i+'\" '+(slots.includes(i)?'disabled':'')+'>'+w+'</button>').join('');$('answer').innerHTML=tokenized.map(p=>'<p>'+p+'</p>').join('');document.querySelectorAll('[data-gap]').forEach(b=>{let i=+b.dataset.gap;b.textContent=slots[i]===null?'?':gapWords[slots[i]];if(checked)b.classList.add(slots[i]===i?'good':'bad');b.onclick=()=>{if(checked)return;if(selected!==null){const previous=slots.indexOf(selected);if(previous!==-1)slots[previous]=null;slots[i]=selected;selected=null}else{slots[i]=null}draw()}});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selected=+b.dataset.word;draw()})}$('check').onclick=()=>{checked=true;draw();const correct=slots.filter((x,i)=>x===i).length;$('feedback').textContent=correct===10?'Excellent! All 10 answers are correct.':correct+' / 10 correct. Green answers are correct; red answers need another try.'};$('retry').onclick=()=>{checked=false;slots.fill(null);selected=null;$('feedback').textContent='';draw()};draw();\nlet context,processor,input,stream,chunks=[],timer,started=0,running=false,mp3Url=null,stoppedAt=null;function clock(){if(!running)return;const seconds=Math.min(240,Math.floor((performance.now()-started)/1000));$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds>=240)stopRecording()}function setStatus(t){$('recStatus').textContent=t}async function startRecording(){if(running)return;if(!window.lamejs){setStatus('MP3 encoder could not load. Check your internet connection and try again.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});context=new (window.AudioContext||window.webkitAudioContext)();input=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(4096,1,1);chunks=[];processor.onaudioprocess=e=>{if(running)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));e.outputBuffer.getChannelData(0).fill(0)};input.connect(processor);const silentOutput=context.createGain();silentOutput.gain.value=0;processor.connect(silentOutput);silentOutput.connect(context.destination);running=true;stoppedAt=null;started=performance.now();clearInterval(timer);timer=setInterval(clock,200);$('start').disabled=true;$('stop').disabled=false;$('again').disabled=true;$('player').hidden=true;$('download').hidden=true;setStatus('Recording…')}catch(e){setStatus('Microphone access failed. Use HTTPS or localhost and allow microphone access.')}}async function stopRecording(){if(!running)return;running=false;stoppedAt=performance.now();clearInterval(timer);timer=null;const elapsed=Math.min(240,Math.floor((stoppedAt-started)/1000));$('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');$('stop').disabled=true;processor.onaudioprocess=null;processor.disconnect();input.disconnect();stream.getTracks().forEach(t=>t.stop());let rate=context.sampleRate;await context.close();setStatus('Encoding MP3…');await new Promise(r=>setTimeout(r,30));try{const encoder=new lamejs.Mp3Encoder(1,rate,128),mp3=[];for(let data of chunks){let pcm=new Int16Array(data.length);for(let i=0;i<data.length;i++){let x=Math.max(-1,Math.min(1,data[i]));pcm[i]=x<0?x*32768:x*32767}let buf=encoder.encodeBuffer(pcm);if(buf.length)mp3.push(new Uint8Array(buf))}let tail=encoder.flush();if(tail.length)mp3.push(new Uint8Array(tail));if(mp3Url)URL.revokeObjectURL(mp3Url);mp3Url=URL.createObjectURL(new Blob(mp3,{type:'audio/mpeg'}));$('player').src=mp3Url;$('player').hidden=false;$('download').href=mp3Url;$('download').hidden=false;$('again').disabled=false;setStatus('Your MP3 is ready. You can play it, download it, or record again.')}catch(e){setStatus('MP3 encoding failed: '+e.message);$('again').disabled=false}}$('start').onclick=startRecording;$('stop').onclick=stopRecording;$('again').onclick=()=>{if(running)return;$('start').disabled=false;$('again').disabled=true;$('player').hidden=true;$('download').hidden=true;setStatus('Ready for a new recording.');$('clock').textContent='00:00'};window.addEventListener('beforeunload',()=>{if(mp3Url)URL.revokeObjectURL(mp3Url)});\n<\/script></body></html>";
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[];
const cards=document.getElementById('cards');
function renderCards(){cards.innerHTML=TITLES.map((title,i)=>`<a href="#task-${String(i+1).padStart(2,'0')}" class="topic ${[0,3,4,7].includes(i%8)?'blue':'purple'}" style="text-decoration:none"><div class="num-area"><span class="num">${String(i+1).padStart(2,'0')}</span></div><div class="topic-title">${escapeHTML(title)}</div><div class="topic-icon"><svg viewBox="0 0 24 24">${ICONS[i]}</svg></div></a>`).join('');}
renderCards();
const frame=document.createElement('iframe');frame.id='exerciseFrame';frame.title='Speaking Task 4 exercise';frame.style.cssText='display:none;position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#D7E2F2;z-index:100';frame.setAttribute('allow','microphone');document.body.appendChild(frame);
function showRoute(){const m=location.hash.match(/^#task-(\d{2})$/);const n=m?Number(m[1]):0;if(!n||n>40||!tasks.length){document.querySelector('main').hidden=false;frame.style.display='none';document.title='Exam Practice · Speaking';return;}
 const t=tasks[n-1];if(!t)return;
 let page=TASK_TEMPLATE.replace('__TITLE__',escapeHTML(t.title)).replace('__IMAGE__',escapeHTML(t.image)).replace('__DOWNLOAD__','Task_4_'+String(n).padStart(2,'0')+'.mp3');
 const payload=JSON.stringify(t).replace(/</g,'\\u003c');
 page=page.replace('const {source,gapWords,info}=window.TASK_DATA;', 'const {source,gapWords,info}='+payload+';');
 page=page.replace('href="index.html"','href="#" target="_top"');
 page=page.replace('href="index.html"','href="#" target="_top"');
 document.querySelector('main').hidden=true;frame.style.display='block';frame.srcdoc=page;document.title='Exam Practice · Speaking';window.scrollTo(0,0);
}
fetch('tasks.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(data.length!==40)throw Error('Expected 40 tasks');tasks=data;showRoute()}).catch(e=>{cards.insertAdjacentHTML('beforebegin','<p style="padding:12px;background:white;color:#b42338">Unable to load tasks.json. Please open this site through GitHub Pages or a local web server.</p>');console.error(e)});

nst tokenized=parts.map(par=>par.replace(new RegExp('\\\\b('+gapWords.map(w=>w.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')).join('|')+')\\\\b','gi'),m=>{let id=gapWords.findIndex(w=>w.toLowerCase()===m.toLowerCase());if(usedGapIds.has(id))return m;usedGapIds.add(id);return '<button class=\"gap\" data-gap=\"'+id+'\" aria-label=\"Gap '+(id+1)+'\">'+(id+1)+'<\/button>'}));function draw(){const shuffled=[...gapWords].map((w,i)=>({w,i})).sort((a,b)=>a.w.localeCompare(b.w));$('bank').innerHTML=shuffled.map(({w,i})=>'<button class=\"word '+(slots.includes(i)?'used ':'')+(selected===i?'chosen':'')+'\" data-word=\"'+i+'\" '+(slots.includes(i)?'disabled':'')+'>'+w+'<\/button>').join('');$('answer').innerHTML=tokenized.map(p=>'<p>'+p+'<\/p>').join('');document.querySelectorAll('[data-gap]').forEach(b=>{let i=+b.dataset.gap;b.textContent=slots[i]===null?'?':gapWords[slots[i]];if(checked)b.classList.add(slots[i]===i?'good':'bad');b.onclick=()=>{if(checked)return;if(selected!==null){const previous=slots.indexOf(selected);if(previous!==-1)slots[previous]=null;slots[i]=selected;selected=null}else{slots[i]=null}draw()}});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selected=+b.dataset.word;draw()})}$('check').onclick=()=>{checked=true;draw();const correct=slots.filter((x,i)=>x===i).length;$('feedback').textContent=correct===10?'Excellent! All 10 answers are correct.':correct+' / 10 correct. Green answers are correct; red answers need another try.'};$('retry').onclick=()=>{checked=false;slots.fill(null);selected=null;$('feedback').textContent='';draw()};draw();\nlet context,processor,input,stream,chunks=[],timer,started=0,running=false,mp3Url=null,stoppedAt=null;function clock(){if(!running)return;const seconds=Math.min(240,Math.floor((performance.now()-started)/1000));$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds>=240)stopRecording()}function setStatus(t){$('recStatus').textContent=t}async function startRecording(){if(running)return;if(!window.lamejs){setStatus('MP3 encoder could not load. Check your internet connection and try again.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});context=new (window.AudioContext||window.webkitAudioContext)();input=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(4096,1,1);chunks=[];processor.onaudioprocess=e=>{if(running)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));e.outputBuffer.getChannelData(0).fill(0)};input.connect(processor);const silentOutput=context.createGain();silentOutput.gain.value=0;processor.connect(silentOutput);silentOutput.connect(context.destination);running=true;stoppedAt=null;started=performance.now();clearInterval(timer);timer=setInterval(clock,200);$('start').disabled=true;$('stop').disabled=false;$('again').disabled=true;$('player').hidden=true;$('download').hidden=true;setStatus('Recording…')}catch(e){setStatus('Microphone access failed. Use HTTPS or localhost and allow microphone access.')}}async function stopRecording(){if(!running)return;running=false;stoppedAt=performance.now();clearInterval(timer);timer=null;const elapsed=Math.min(240,Math.floor((stoppedAt-started)/1000));$('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0');$('stop').disabled=true;processor.onaudioprocess=null;processor.disconnect();input.disconnect();stream.getTracks().forEach(t=>t.stop());let rate=context.sampleRate;await context.close();setStatus('Encoding MP3…');await new Promise(r=>setTimeout(r,30));try{const encoder=new lamejs.Mp3Encoder(1,rate,128),mp3=[];for(let data of chunks){let pcm=new Int16Array(data.length);for(let i=0;i<data.length;i++){let x=Math.max(-1,Math.min(1,data[i]));pcm[i]=x<0?x*32768:x*32767}let buf=encoder.encodeBuffer(pcm);if(buf.length)mp3.push(new Uint8Array(buf))}let tail=encoder.flush();if(tail.length)mp3.push(new Uint8Array(tail));if(mp3Url)URL.revokeObjectURL(mp3Url);mp3Url=URL.createObjectURL(new Blob(mp3,{type:'audio/mpeg'}));$('player').src=mp3Url;$('player').hidden=false;$('download').href=mp3Url;$('download').hidden=false;$('again').disabled=false;setStatus('Your MP3 is ready. You can play it, download it, or record again.')}catch(e){setStatus('MP3 encoding failed: '+e.message);$('again').disabled=false}}$('start').onclick=startRecording;$('stop').onclick=stopRecording;$('again').onclick=()=>{if(running)return;$('start').disabled=false;$('again').disabled=true;$('player').hidden=true;$('download').hidden=true;setStatus('Ready for a new recording.');$('clock').textContent='00:00'};window.addEventListener('beforeunload',()=>{if(mp3Url)URL.revokeObjectURL(mp3Url)});\n<\/script><\/body><\/html>";

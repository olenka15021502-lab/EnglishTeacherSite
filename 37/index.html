<style>
:root{--ink:#362051;--purple:#7029b5;--lav:#ead9ff;--pink:#f9d8ef;--light:#faf7ff;--border:#dbc7f1;--green:#207a4c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 15% 5%,#dcc8ff 0,transparent 45%),radial-gradient(ellipse at 85% 25%,#f8d7ef 0,transparent 42%),linear-gradient(160deg,#f9f5ff,#f0e6ff);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e88aca;outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:40px 22px 80px}.brand{display:table;margin:0 auto 26px;background:#ffffffa8;border:1px solid #fff;border-radius:30px;padding:10px 24px;color:#65239f;font-weight:700;box-shadow:0 8px 25px #7a45b019}.hero{text-align:center;margin:0 auto 42px}.hero h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,65px);color:#59218f;margin:0 0 12px}.hero p{font-size:clamp(15px,2vw,19px);color:#72518f;margin:0}.group{margin:0 0 34px}.group h2{font-family:Georgia,serif;font-size:23px;color:#5b258b;margin:0 0 16px;padding-bottom:9px;border-bottom:2px solid #d8b7f4}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.topic{border:1.5px solid #d7b7ef;background:linear-gradient(145deg,#fff,#f3eaff);border-radius:19px;min-height:118px;padding:18px 12px;box-shadow:0 9px 18px #6f3d981a;display:flex;justify-content:center;align-items:center;text-align:center;color:#5b238b;font-size:17px;font-weight:700;line-height:1.35;transition:transform .2s,box-shadow .2s,border-color .2s}.topic:hover{transform:translateY(-5px);box-shadow:0 16px 25px #6f3d982e;border-color:#ab6ce0}.group:nth-of-type(even) .topic{background:linear-gradient(145deg,#fff,#fcebf7)}.overlay{position:fixed;inset:0;background:#26143cbb;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}.overlay.open{display:flex}.modal{background:#fbf8ff;width:min(920px,100%);max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px;box-shadow:0 22px 90px #1d092d75;position:relative}.modal-top{position:sticky;top:0;z-index:5;background:#f8f1ffed;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 24px;border-bottom:1px solid var(--border)}.modal-title{font-family:Georgia,serif;font-size:clamp(20px,3vw,27px);font-weight:bold;color:#5c238f}.close{border:0;background:#ead8fc;color:#5d218d;border-radius:50%;font-size:25px;width:39px;height:39px;flex:none}.modal-content{padding:24px 30px 34px}.section-label{font-family:Georgia,serif;color:#62289c;font-size:25px;margin:0 0 15px}.exam{background:linear-gradient(130deg,#f1e5ff,#fff3fb);border:1.5px solid #d8b5f4;border-left:5px solid #9a57d1;border-radius:18px;padding:24px 26px;box-shadow:0 8px 20px #70349d14;font-size:16px;line-height:1.75}.exam p{margin:0 0 13px}.exam p:last-child{margin-bottom:0}.exam .meta{background:#fff9;border-radius:10px;padding:12px 15px;line-height:1.8;margin-bottom:16px}.exam .incoming{font-style:italic;font-weight:400;color:#3d255b;white-space:pre-wrap}.exam .requirements{margin:0 0 12px 20px;padding:0}.exam .requirements li{padding-left:2px}.sample-section{margin-top:32px}.sample-box{background:white;border:1.5px solid #dfc9f4;border-radius:18px;padding:23px 25px;box-shadow:0 8px 25px #67319712;font-family:Georgia,serif;font-size:18px;line-height:1.9}.sample-box p{margin:0 0 15px;white-space:pre-wrap}.sample-box p:last-child{margin-bottom:0}.hint{font-family:system-ui,sans-serif;color:#77568f;font-size:14px;margin:-7px 0 17px}.order-list{display:flex;flex-direction:column;gap:11px}.order-card{background:#fff;border:2px solid #d8b4fe;border-radius:12px;padding:15px;display:flex;gap:12px;align-items:center;transition:background .2s,border-color .2s}.order-card.correct{background:#e5f8e9;border-color:#4ade80;box-shadow:0 0 12px #4ade8030}.order-text{flex:1;white-space:pre-wrap;font-family:Georgia,serif;font-size:17px;line-height:1.6;min-width:0}.arrows{display:flex;flex-direction:column;gap:5px}.arrows button{background:#6b21a8;color:white;border:0;border-radius:6px;width:35px;height:32px;font-size:20px;line-height:1}.arrows button:disabled{opacity:.3;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}.action{background:#6b21a8;color:white;border:0;border-radius:11px;padding:12px 23px;font-weight:700}.action.secondary{background:#f0e4fc;color:#63239b}.feedback{margin:14px 0 0;font-family:system-ui,sans-serif;font-size:15px;font-weight:650;min-height:22px}.gap{font-family:Georgia,serif;letter-spacing:.04em;border-bottom:2px dashed #bb8de6;color:#7236a7;font-weight:bold}.reveal{background:#f1e2ff;color:#6b21a8;border:1px solid #d8b4fe;border-radius:20px;padding:1px 9px;margin:0 3px;font:700 14px system-ui}.reveal.done{background:#dff6e6;color:#22754c;border-color:#9cdeb1}.revealed-word{color:#207a4c;font-weight:bold}.progress{font:13px system-ui;color:#77568f;margin-top:20px}.progress-track{height:7px;background:#eee1f8;border-radius:20px;overflow:hidden;margin-top:7px}.progress-fill{height:100%;background:linear-gradient(90deg,#b77be9,#63c78b);width:0;transition:width .25s}.bank{position:sticky;top:74px;z-index:3;background:#f3e8ffed;backdrop-filter:blur(8px);border:1px solid #d8b4fe;border-radius:14px;padding:13px 15px;margin:0 0 16px;box-shadow:0 5px 16px #632b8e20}.bank-title{font:700 13px system-ui;color:#67329b;margin-bottom:9px}.bank-words{display:flex;flex-wrap:wrap;gap:7px}.word{border:1px solid #bb8adf;border-radius:20px;background:#fff;color:#64299b;padding:7px 13px;font-weight:700;font-size:14px}.word.used{opacity:.28;pointer-events:none}.word.selected{background:#6b21a8;color:white}.inline-gap{display:inline-block;min-width:75px;padding:0 8px;border:0;border-bottom:2px dashed #a76dd4;border-radius:4px;background:#f4e9ff;color:#5d258c;font-family:Georgia,serif;font-size:inherit;line-height:1.5}.inline-gap.active{outline:2px solid #a55cdb}.inline-gap.filled{background:#e2f7e8;border-bottom-color:#55b77d;color:#23673e}.inline-gap.wrong{background:#ffe5e9;border-bottom-color:#d96b7b}.mini-note{font:13px system-ui;color:#77568f;margin:0 0 12px}.footer-note{text-align:center;color:#7c60a1;font-size:12px;margin-top:40px}@media(max-width:720px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:27px 15px 50px}.topic{min-height:96px;font-size:15px}.overlay{padding:0}.modal{max-height:100dvh;height:100dvh;border-radius:0}.modal-top{padding:13px 16px}.modal-content{padding:18px 14px 32px}.exam{padding:17px 15px;font-size:15px}.sample-box{padding:16px 13px;font-size:17px}.bank{top:66px}.order-card{padding:11px}.order-text{font-size:16px}.hero{margin-bottom:30px}}@media(max-width:370px){.cards{gap:9px}.topic{font-size:14px;padding:10px}}

<script>
'use strict';
const DATA=[{"id": 1, "title": "Ivan Aivazovsky", "friend": "Ben", "category": "Russian Artists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Ben.\n\nFrom: Ben To: Russian_friend Subject: Russian art\n\n...We're learning about art from different countries at school. I'd love to find out more about Russian painting. Who is your favourite Russian artist? Which painting by this artist do you like most? Why do you like it?\n\nBy the way, my parents and I are going to visit a famous museum in London next weekend.\n\nWrite an email to Ben.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the museum.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Ben,\n\nThanks a lot for your email. It was great to hear from you!\n\nI'm happy to tell you about Russian art. My favourite Russian artist is Ivan Aivazovsky, who was famous for painting the sea. I especially like his painting \"The ninth wave\". It shows people struggling to survive after a terrible storm. I love the way he painted the waves and the light in the sky. The picture looks dramatic, but it also gives me a feeling of hope. I'd love to see the original one day.\n\nYour museum visit sounds wonderful! Which museum are you going to visit? What is it best known for? Have you booked your tickets yet?\n\nWrite back soon.\n\nBest wishes,\nMary", "mechanic": 0}, {"id": 2, "title": "Isaac Levitan", "friend": "Kate", "category": "Russian Artists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Kate.\n\nFrom: Kate To: Russian_friend Subject: Russian landscapes\n\n...We've been looking at landscape paintings in our art lessons. I'm curious about Russian artists. Which Russian landscape painter would you recommend? What did this artist usually paint? Would you like to try painting something similar yourself?\n\nBy the way, I went scuba diving during my holiday last week. It was an amazing experience!\n\nWrite an email to Kate.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about scuba diving.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Kate,\n\nThank you for your email. It was lovely to hear from you!\n\nI'd like to tell you about Isaac Levitan, a famous Russian landscape painter. He often painted quiet rivers, forests and fields. I particularly like how his pictures capture the changing seasons and the peaceful atmosphere of the countryside. His paintings remind me of places I've visited with my family. Personally, I'd love to try painting a landscape myself, although I'm not very good at drawing yet. Perhaps I'll start with a simple view of a river near my home.\n\nYour diving experience sounds exciting! Where did you go diving? Did you have an instructor with you? What was the most amazing thing you saw underwater?\n\nWrite back soon.\n\nBest wishes,\nAndrew", "mechanic": 1}, {"id": 3, "title": "Viktor Vasnetsov", "friend": "Oliver", "category": "Russian Artists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Oliver.\n\nFrom: Oliver To: Russian_friend Subject: Art and stories\n\n...In our art class, we've been discussing paintings inspired by stories and legends. Do Russian artists paint subjects like these? Which Russian artist would you recommend? What is one of this artist's most interesting paintings?\n\nBy the way, I've got a part in our school play, and rehearsals have just started!\n\nWrite an email to Oliver.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the school play.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Oliver,\n\nThanks for your email. It was great to hear from you!\n\nI'm glad you're interested in Russian art. Many Russian artists have painted scenes from traditional stories and legends. One of them is Viktor Vasnetsov. I'd recommend his painting \"Ivan Tsarevich riding the grey wolf\". It shows a prince and a princess escaping through a forest on a magical wolf. I like its mysterious atmosphere and the way the characters seem to be moving. It makes me want to find out what happens next in the story.\n\nCongratulations on getting a part in the school play! What's the play about? What role do you have? When will the performance take place?\n\nWrite back soon.\n\nBest wishes,\nSophie", "mechanic": 2}, {"id": 4, "title": "Valentin Serov", "friend": "Sophie", "category": "Russian Artists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Sophie.\n\nFrom: Sophie To: Russian_friend Subject: Russian portraits\n\n...We've recently been studying portraits in our art lessons. I'd like to learn about Russian painters. Which Russian portrait painter would you recommend? What is one of this artist's best-known paintings? What do you like about it?\n\nBy the way, our school is holding a photography competition next month. I'm thinking of entering it!\n\nWrite an email to Sophie.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the photography competition.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Sophie,\n\nThank you for your email. It was great to hear from you!\n\nI'd like to tell you about Valentin Serov, a famous Russian portrait painter. One of his best-known works is \"Girl with peaches\". It shows a young girl sitting at a table in a bright room. I particularly like the sunlight and the warm colours in this painting. The girl looks very natural, as if she has just stopped for a moment. I think Serov was brilliant at capturing people's expressions. I'd love to see this picture in a museum one day.\n\nYour photography competition sounds interesting! What are the rules of the competition? How many photos do you need to submit? What's the main prize?\n\nWrite back soon.\n\nBest wishes,\nDaniel", "mechanic": 3}, {"id": 5, "title": "Leo Tolstoy", "friend": "James", "category": "Russian Writers", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend James.\n\nFrom: James To: Russian_friend Subject: Russian literature\n\n...We're reading books by writers from different countries. I'd like to learn about Russian literature. Which Russian writer would you recommend? What are this writer's best-known books? Why do you think people still read them?\n\nBy the way, my family is planning a holiday in a cottage in Scotland this summer.\n\nWrite an email to James.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the Scottish holiday.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear James,\n\nThanks a lot for your email. It was great to hear from you!\n\nI'm happy to tell you about Russian literature. I'd recommend Leo Tolstoy, one of Russia's most famous writers. His best-known novels include \"War and peace\" and \"Anna Karenina\". Both books explore people's feelings, relationships and difficult choices. I think readers still enjoy Tolstoy because his characters seem real, even though he wrote about life a long time ago. His books are quite long, but they give you a lot to think about. I hope to read more of his work in the future.\n\nYour holiday in Scotland sounds lovely! How long are you going to stay there? What places are you planning to visit? What outdoor activities would you like to try?\n\nWrite back soon.\n\nBest wishes,\nKate", "mechanic": 0}, {"id": 6, "title": "Fyodor Dostoevsky", "friend": "Emily", "category": "Russian Writers", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Emily.\n\nFrom: Emily To: Russian_friend Subject: Russian novels\n\n...We're learning about famous writers from different countries in our literature lessons. I'd like to know more about Russian literature. Which Russian writer would you recommend learning about? What is one of this writer's most famous works? Why do people still read this writer's books today?\n\nBy the way, I'm taking part in a charity run organised by our school next month.\n\nWrite an email to Emily.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the charity run.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Emily,\n\nThank you for your email. It was lovely to hear from you!\n\nI'd recommend Fyodor Dostoevsky, one of Russia's most famous novelists. One of his best-known books is \"Crime and punishment\". It tells the story of a young man who commits a crime and struggles with guilt afterwards. I think people still read Dostoevsky because his novels explore important questions about right and wrong. His characters often face difficult decisions, which makes their stories interesting even today. Although some of his books are challenging, they can teach us a lot about human nature.\n\nGood luck with your charity run! How far will you have to run? Which charity are you raising money for? How many students are taking part?\n\nWrite back soon.\n\nBest wishes,\nAlex", "mechanic": 1}, {"id": 7, "title": "Anton Chekhov", "friend": "Daniel", "category": "Russian Writers", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Daniel.\n\nFrom: Daniel To: Russian_friend Subject: Short stories\n\n...Our class has recently been discussing short stories. I'd like to find out more about Russian writers. Which Russian writer is famous for short stories? Which story would you recommend to a teenager? Do Russian students study this writer's works at school?\n\nBy the way, I'm going on a school trip to Edinburgh next month.\n\nWrite an email to Daniel.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the Edinburgh trip.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Daniel,\n\nThanks for your email. It was great to hear from you!\n\nI'm glad you're interested in Russian short stories. I'd recommend Anton Chekhov, who wrote many stories about ordinary people and their behaviour. One of his stories that teenagers might enjoy is \"The chameleon\". It's about a police officer who keeps changing his opinion depending on who he thinks owns a dog. I find it funny because it shows how people sometimes behave towards those in power. We study some of Chekhov's works at school, and they often lead to interesting discussions.\n\nYour trip to Edinburgh sounds great! How many days will you spend there? Which historical places are you going to visit? Will you have a guided tour of the city?\n\nWrite back soon.\n\nBest wishes,\nEmma", "mechanic": 2}, {"id": 8, "title": "Nikolai Gogol", "friend": "Lucy", "category": "Russian Writers", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Lucy.\n\nFrom: Lucy To: Russian_friend Subject: Humour in literature\n\n...We're studying humour in literature at school. I've heard that some Russian writers are famous for their funny and unusual stories. Could you tell me about one of them? What is one of this writer's most famous works? Do Russian teenagers read this writer's works at school?\n\nBy the way, I've entered our school cooking competition, which takes place next week.\n\nWrite an email to Lucy.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the cooking competition.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Lucy,\n\nThank you for your email. It was great to hear from you!\n\nI'd like to tell you about Nikolai Gogol, a Russian writer known for his humour and satire. One of his most famous works is the play \"The government inspector\". It tells the story of officials who mistake an ordinary visitor for an important inspector. Their attempts to impress him lead to some very funny situations. Russian teenagers often study this play at school. I think it is still interesting because it makes fun of dishonesty and the desire to appear important.\n\nYour cooking competition sounds fun! What dish are you going to make? How much time will you have to prepare it? What will the winner receive?\n\nWrite back soon.\n\nBest wishes,\nJames", "mechanic": 3}, {"id": 9, "title": "Alexander Pushkin", "friend": "Thomas", "category": "Russian Poets", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Thomas.\n\nFrom: Thomas To: Russian_friend Subject: Russian poetry\n\n...We're learning about famous poets from different countries. I'd like to know more about Russian poetry. Which Russian poet would you recommend learning about? What is your favourite work by this poet? Do Russian students learn this poet's poems by heart?\n\nBy the way, I've got a new bicycle and I'm planning a cycling trip with my friends this weekend.\n\nWrite an email to Thomas.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the cycling trip.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Thomas,\n\nThanks a lot for your email. It was great to hear from you!\n\nI'm happy to tell you about Russian poetry. I'd recommend Alexander Pushkin, one of the most famous Russian poets. My favourite work by him is \"Eugene Onegin\", although I also enjoyed reading \"The tale of Tsar Saltan\" when I was younger. I like Pushkin's writing because it is full of memorable characters and interesting stories. As for learning poetry by heart, Russian students often memorise Pushkin's poems at school. I think this helps us appreciate the rhythm of his language.\n\nYour cycling trip sounds great! Where are you planning to go? How far will you cycle? Are you going to stop for a picnic?\n\nWrite back soon.\n\nBest wishes,\nLucy", "mechanic": 0}, {"id": 10, "title": "Mikhail Lermontov", "friend": "Charlotte", "category": "Russian Poets", "task": "Task 37\n\nYou have received an email message from your English-speak ss and difficult experiences in people's lives. I think her poetry is special because she could express strong feelings in simple but powerful words. As for Russian teenagers, they usually learn about Akhmatova at school, although not everyone reads her poems in their free time.\n\nIt's great that you're helping at the book fair! What kinds of books will be on sale? How many stalls will there be? What will you be responsible for?\n\nWrite back soon.\n\nBest wishes,\nAndrew", "mechanic": 3}, {"id": 13, "title": "Dmitri Mendeleev", "friend": "Harry", "category": "Russian Scientists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Harry.\n\nFrom: Harry To: Russian_friend Subject: Famous scientists\n\n...We're doing a project about scientists who changed the world. I'd like to include someone from Russia. Which famous Russian scientist would you recommend? What is this scientist best known for? Do you learn about this scientist at school?\n\nBy the way, my friends and I are going camping next weekend. We're really looking forward to spending some time outdoors!\n\nWrite an email to Harry.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the camping trip.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Harry,\n\nThanks for your email. It was nice to hear from you!\n\nOne famous Russian scientist is Dmitri Mendeleev. He is best known for developing the periodic table of chemical elements. His work was important because it helped scientists organise the elements and even predict some that had not been discovered yet. Personally, I find his ability to notice patterns especially impressive. We learn about Mendeleev in chemistry lessons at school.\n\nYour camping trip sounds fun! Where are you going to camp? How many nights will you stay there? What activities are you planning to do?\n\nWrite back soon.\n\nBest wishes,\nSophie", "mechanic": 0}, {"id": 14, "title": "Ivan Pavlov", "friend": "Emma", "category": "Russian Scientists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Emma.\n\nFrom: Emma To: Russian_friend Subject: Science discoveries\n\n...In our science lessons, we've been discussing how scientists study human and animal behaviour. I'd like to find out more about Russian scientists. Can you tell me about a famous Russian scientist? What did this scientist discover? Why are these discoveries still important today?\n\nBy the way, our school is holding a sports day next Friday. I've signed up for two events, and I've already started practising!\n\nWrite an email to Emma.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about sports day.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Emma,\n\nThank you for your email. It was lovely to hear from you!\n\nI'd like to tell you about Ivan Pavlov, a famous Russian scientist. He studied how animals and people respond to different signals. In particular, his experiments with dogs helped explain how certain responses can be learned. I think his discoveries are still important because they influenced the study of behaviour. As for science lessons, we sometimes discuss his experiments at school.\n\nGood luck with your school sports day! Which events are you taking part in? Will students compete in teams? What prizes will the winners receive?\n\nLooking forward to your reply.\n\nTake care,\nDaniel", "mechanic": 1}, {"id": 15, "title": "Konstantin Tsiolkovsky", "friend": "George", "category": "Russian Scientists", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend George.\n\nFrom: George To: Russian_friend Subject: Space exploration\n\n...Our class is preparing presentations about the history of space exploration. I know that Russian scientists played an important part in it. Which Russian scientist connected with space exploration would you recommend learning t was great to hear from you!\n\nI'd like to tell you about Sofia Kovalevskaya, a famous Russian mathematician. She made important contributions to mathematics, particularly to the study of differential equations, and became one of the first women in Europe to hold a university professorship in mathematics. Personally, I think her work is important because it helped develop mathematics and showed that women could achieve great success in science despite the difficulties they faced at that time.\n\nYour school film festival sounds interesting! Where will the festival take place? How long will it last? Will the audience be able to vote for their favourite film?\n\nWrite back soon.\n\nBest wishes,\nAlex", "mechanic": 3}, {"id": 17, "title": "Maslenitsa", "friend": "Alice", "category": "Russian Holidays", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Alice.\n\nFrom: Alice To: Russian_friend Subject: Traditional holidays\n\n...We've been learning about traditional celebrations in different countries. I'd love to know more about Russian customs. Which traditional Russian holiday would you recommend learning about? How do people usually celebrate it? What do you like most about this holiday?\n\nBy the way, my family is planning a weekend trip to the countryside next month. We're all looking forward to a short break!\n\nWrite an email to Alice.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the countryside trip.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Alice,\n\nThanks a lot for your email. It was great to hear from you!\n\nI'd like to tell you about Maslenitsa, a traditional Russian holiday that marks the end of winter. People celebrate it by making pancakes, visiting friends and taking part in outdoor activities. In some places, there are fairs with music, games and traditional performances. Personally, I enjoy the cheerful atmosphere most of all. I also love eating pancakes with different fillings, especially jam. It's a wonderful opportunity for families and friends to spend time together.\n\nYour countryside trip sounds lovely! Where are you going to stay? What places would you like to explore? Are you planning any outdoor activities?\n\nWrite back soon.\n\nBest wishes,\nEmma", "mechanic": 0}, {"id": 18, "title": "Victory Day", "friend": "William", "category": "Russian Holidays", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend William.\n\nFrom: William To: Russian_friend Subject: National holidays\n\n...Our history teacher has asked us to find out how people in different countries remember important events from the past. I'm interested in Russian national holidays. Which holiday connected with history is especially important in Russia? How do people mark this day? Why is it meaningful to Russian families?\n\nBy the way, I've joined a local history club. We're going to visit an old castle together next Saturday!\n\nWrite an email to William.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the castle visit.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear William,\n\nThank you for your email. It was lovely to hear from you!\n\nOne of the most important holidays in Russia is Victory Day, celebrated on 9 May. It marks the victory over Nazi Germany in 1945. People attend commemorative events, lay flowers at war memorials and remember those who lost their lives. Some families also look through old photographs and share stories about relatives who lived during the war. I think this holiday is especially meaningful because it helps younger generations understand the sacrifices people made and the importance of peace.\n\nYour castle visit sounds interesting! Which castle are you going to visit? Will you have a guide? What would you like to learn about its history?\n\nWrite back soon.\n\nBest wishes,\nJames", "mechanic": 1}, {"id": 19 ian_friend Subject: Sporting legends\n\n...We're preparing a school project about great athletes of the twentieth century. I'd like to include someone from Russia. Which famous Russian athlete from the past would you recommend? What did this person achieve in sport? Why do you think people still remember this athlete? By the way, I spent last weekend on my uncle's farm. It was my first visit, and I really enjoyed it!\n\nWrite an email to Peter.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the farm visit.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Peter,\n\nThanks a lot for your email. It was great to hear from you!\n\nI'm glad you're interested in Russian sporting legends. I'd recommend Lev Yashin, a famous Soviet football goalkeeper. He played for Dynamo Moscow and the Soviet national team. In 1963, he became the first and only goalkeeper to win the Ballon d'Or, a major football award. He was known for his quick reactions and excellent saves. I think people still remember him because he changed the way goalkeepers played and inspired many young footballers. Even today, he is considered one of the greatest goalkeepers in football history.\n\nI'm glad you enjoyed your farm visit! What animals did you see there? Did you help with any farm work? How long did you stay?\n\nWrite back soon.\n\nBest wishes,\nMaksim", "mechanic": 0}, {"id": 26, "title": "Larisa Latynina", "friend": "Chloe", "category": "Famous Russian Athletes", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Chloe.\n\nFrom: Chloe To: Russian_friend Subject: Olympic champions\n\n...Our class is learning about athletes who made Olympic history. I'm especially interested in sports stars from Russia. Which famous Russian Olympic athlete from the twentieth century would you choose? What were this athlete's greatest achievements? What qualities helped this person become successful? By the way, I attended an art workshop at our community centre last Saturday. I tried something completely new!\n\nWrite an email to Chloe.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the art workshop.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Chloe,\n\nThank you for your email. It was lovely to hear from you!\n\nI'd be happy to tell you about a famous Olympic champion. Larisa Latynina was an outstanding Soviet gymnast who won 18 Olympic medals, including nine gold medals. She competed at three Olympic Games and became one of the most successful gymnasts in history. I think her greatest strengths were determination, discipline and the ability to stay calm under pressure. She trained extremely hard and continued to achieve excellent results for many years. Her career shows how important patience and regular practice are in sport.\n\nI'm pleased you tried something new at the workshop! What techniques did you learn? How many people were in your group? Did you create anything to take home?\n\nHope to hear from you soon.\n\nAll the best,\nOleg", "mechanic": 1}, {"id": 27, "title": "Alina Zagitova", "friend": "Isabelle", "category": "Famous Russian Athletes", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Isabelle.\n\nFrom: Isabelle To: Russian_friend Subject: Modern sports stars\n\n...We've been discussing successful young athletes in our English lessons. I'd like to learn more about Russian sports stars. Which modern Russian athlete would you recommend learning about? What has this athlete achieved? Why do you admire this person? By the way, I took part in a school gardening project last month. We created a new garden in the school grounds!\n\nWrite an email to Isabelle.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the gardening project.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Isabelle,\n\nThanks for your email. It was wonderful to hear from you!\n\nI'm happy to tell you about a modern Russian sports star. I'd choose Alina Zagitova, a talented figure skater. She won the gold medal in women's singles at the 2018 Winter Olympics when she was only fifteen. She also became a world champion in 2019. I admire her because figure skating requires strength, balance and hours of practice. Her performances were beautiful, but they also included very difficult jumps. I think her achievements show how much young athletes can accomplish through hard work and determination.\n\nI'm curious about your school gardening project! What plants did you grow? How long did it take to create the garden? Did you work on it during lessons or after school?\n\nLooking forward to your email.\n\nTake care,\nSvetlana", "mechanic": 2}, {"id": 28, "title": "Daniil Medvedev", "friend": "Andrew", "category": "Famous Russian Athletes", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Andrew.\n\nFrom: Andrew To: Russian_friend Subject: Famous athletes\n\n...Our sports club is making a display about successful athletes from different countries. I'd like to include a Russian sports star. Which modern Russian athlete would you recommend? What important competitions has this athlete won? What makes this person a successful sportsperson? By the way, my friends and I organised a quiz evening at our school last Friday. We prepared everything ourselves!\n\nWrite an email to Andrew.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the quiz evening.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Andrew,\n\nThank you for your email. It was great to hear from you!\n\nI'd like to tell you about Daniil Medvedev, a famous Russian tennis player. He won the US Open in 2021, defeating Novak Djokovic in the final. He has won several other major tennis tournaments and reached the top of the world rankings. I think his success comes from his excellent concentration, clever tactics and ability to stay focused during difficult matches. What I find particularly impressive is that he can change his strategy when a match isn't going well. He's a good example of how important both physical fitness and mental strength are in sport.\n\nI'm sure organising the quiz was an interesting experience! What topics did the questions cover? How many teams took part? Which team won the competition?\n\nWrite back soon.\n\nBest wishes,\nIlya", "mechanic": 0}, {"id": 29, "title": "Alexander Nevsky", "friend": "Oliver", "category": "Famous Figures in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Oliver.\n\nFrom: Oliver To: Russian_friend Subject: Historical figures\n\n...We're studying famous people from different countries in our history lessons. I'd like to learn about someone from medieval Russia. Which historical figure would you recommend? What is this person famous for? Why is this person still remembered in Russia today? By the way, I went on a boat trip with my cousins last Sunday. We spent almost the whole day on the river!\n\nWrite an email to Oliver.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the boat trip.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Oliver,\n\nThanks for your email. It was great to hear from you!\n\nThere are interesting people from medieval Russian history, but I'd recommend Alexander Nevsky. He was a Russian prince and military leader who lived in the thirteenth century. He is especially famous for defeating Swedish forces in 1240 and winning the Battle on the Ice in 1242. These victories made him an important historical figure. Besides, he was known for his leadership during a difficult period in Russian history. In my opinion, people still remember him because he defended his lands and became a symbol of courage. There are monuments to him in Russia today.\n\nI'd love to hear more about your boat trip! Where did you start your journey? Did you stop anywhere along the river? What did you enjoy most?\n\nWrite back soon.\n\nBest wishes,\nKirill", "mechanic": 1}, {"id": 30, "title": "Peter the Great", "friend": "Sophie", "category": "Famous Figures in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Sophie.\n\nFrom: Sophie To: Russian_friend Subject: Famous rulers\n\n...Our class is preparing presentations about rulers who changed their countries. I'd like to choose someone from Russian history. Which Russian ruler would you recommend? What important changes did this ruler introduce? What can visitors see in Russia today that is connected with this person? By the way, I've joined the team that produces our school newspaper. We're going to publish our first issue next month!\n\nWrite an email to Sophie.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the school newspaper.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Sophie,\n\nThank you for your email. It was lovely to hear from you!\n\nRussia has had many famous rulers, and Peter the Great would be a good choice for your presentation. He ruled Russia in the late seventeenth and early eighteenth centuries and introduced important reforms. For example, he developed the navy, improved the army and encouraged the study of science and technology. He also founded Saint Petersburg in 1703. As a result, he had a lasting influence on the country's development. Today, tourists can visit the Peter and Paul Fortress and see the Bronze Horseman, a famous monument to Peter in Saint Petersburg.\n\nI'm curious about your school newspaper! What will you write about? How many students are working on it? Will you publish it online?\n\nHope to hear from you soon.\n\nAll the best,\nPolina", "mechanic": 2}, {"id": 31, "title": "Mikhail Kutuzov", "friend": "Henry", "category": "Famous Figures in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Henry.\n\nFrom: Henry To: Russian_friend Subject: Military leaders\n\n...We've been learning about famous military leaders in our history lessons. I'd like to find out more about Russian commanders. Which Russian military leader from the nineteenth century would you recommend learning about? What important historical event did this person take part in? Why do people remember this commander? By the way, I helped my grandfather repair his old bicycle last weekend. We spent several hours working on it together!\n\nWrite an email to Henry.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about repairing the bicycle.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Henry,\n\nThanks a lot for your email. It was nice to hear from you!\n\nIf you're studying nineteenth-century military history, there's an important Russian commander you should know about. His name is Mikhail Kutuzov. He led the Russian army during Napoleon's invasion of Russia in 1812 and commanded it at the Battle of Borodino. Later, he made the difficult decision to leave Moscow in order to save his army. This helped Russia continue fighting Napoleon's forces. I think Kutuzov is remembered because he was an experienced commander who made important decisions under pressure. Today, there are monuments to him in several Russian cities.\n\nIt was kind of you to help your grandfather! What was wrong with the bicycle? Which parts did you repair? Was it difficult to fix it?\n\nLooking forward to your email.\n\nTake care,\nNikita", "mechanic": 0}, {"id": 32, "title": "Georgy Zhukov", "friend": "Grace", "category": "Famous Figures in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Grace.\n\nFrom: Grace To: Russian_friend Subject: People in history\n\n...Our school is organising a history exhibition about important people of the twentieth century. I'd like to include a Russian military leader. Who would you suggest? What role did this person play in history? How is this person remembered in Russia today? By the way, my family is planning to adopt a dog from an animal shelter next weekend. We're all looking forward to welcoming a new pet!\n\nWrite an email to Grace.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the dog.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Grace,\n\nMany thanks for your email. It was great to hear from you!\n\nThere are several well-known Russian military leaders, and one person you could include is Georgy Zhukov. He was a Soviet commander who played an important role during the Second World War. For instance, he helped organise major military operations, including the defence of Moscow and the battle for Berlin. He became one of the best-known Soviet marshals. In Russia, people remember him for his contribution to the victory over Nazi Germany. His name appears in history books, and there are monuments to him in different Russian cities.\n\nHow lovely that your family is adopting a dog! How old is the dog? What breed is it? Have you chosen a name for it yet?\n\nWrite back soon.\n\nBest wishes,\nDaria", "mechanic": 1}, {"id": 33, "title": "The Battle of Kulikovo (1380)", "friend": "Matthew", "category": "Important Events in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Matthew.\n\nFrom: Matthew To: Russian_friend Subject: Important battles\n\n...We're studying important battles from different periods of history. I'd like to learn about a famous battle that took place in medieval Russia. Which battle would you recommend learning about? When did it take place and who fought in it? Why was this battle important for Russian history? By the way, I took part in a school cooking competition last Friday. We had to prepare a dish in just one hour!\n\nWrite an email to Matthew.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the cooking competition.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Matthew,\n\nThanks for your email. It was great to hear from you!\n\nThere were several important battles in medieval Russian history, and I'd recommend learning about the Battle of Kulikovo. It took place in 1380 between Russian forces led by Prince Dmitry Donskoy and an army commanded by Mamai. The Russian forces won the battle. Although this victory did not immediately end Mongol rule, it showed that the Russian principalities could fight together against a powerful enemy. As a result, the battle became an important symbol of unity and courage. Today, it is still studied in Russian schools.\n\nI'd love to know more about your cooking competition! What dish did you prepare? How many students took part? Did you manage to finish your dish on time?\n\nWrite back soon.\n\nBest wishes,\nRoman", "mechanic": 2}, {"id": 34, "title": "The Battle of Borodino (1812)", "friend": "Lucy", "category": "Important Events in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Lucy.\n\nFrom: Lucy To: Russian_friend Subject: History project\n\n...I'm preparing a project about famous battles of the nineteenth century. I'd like to include an important battle from Russian history. Which battle would you suggest? What happened during this battle? Why do people still remember it today? By the way, I'm going to take part in a charity run in our town next Sunday. It's my first time doing anything like this!\n\nWrite an email to Lucy.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the charity run.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Lucy,\n\nThank you for your email. It was lovely to hear from you!\n\nOne of the most famous battles in Russian history took place during Napoleon's invasion in 1812. It was the Battle of Borodino, fought near Moscow between the Russian and French armies. Both sides suffered heavy losses, and the Russian army later withdrew. However, Napoleon failed to destroy the Russian forces. The battle is remembered for the courage of the soldiers and its importance in the war against Napoleon. Today, people can visit the Borodino battlefield and its monuments. The battle is also described in Leo Tolstoy's novel “War and Peace”.\n\nGood luck with your charity run! How far will you run? Who are you going to run with? What charity will the event support?\n\nHope to hear from you soon.\n\nBest wishes,\nAlisa", "mechanic": 0}, {"id": 35, "title": "The Battle of Stalingrad (1942–1943)", "friend": "Thomas", "category": "Important Events in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Thomas.\n\nFrom: Thomas To: Russian_friend Subject: Turning points in history\n\n...In our history lessons, we're discussing events that changed the course of the Second World War. I'd like to find out more about an important battle that took place in the Soviet Union. Which battle would you recommend studying? What happened during it? Why is it considered a turning point in the war? By the way, I went to a science museum with my younger brother on Saturday. We spent hours exploring the interactive exhibits!\n\nWrite an email to Thomas.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the museum visit.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Thomas,\n\nThanks a lot for your email. It was nice to hear from you!\n\nThere were several major battles during the Second World War, but the Battle of Stalingrad was especially important. It lasted from 1942 to 1943 and involved Soviet and German forces fighting for control of the city. After months of terrible fighting, the Soviet army surrounded and defeated a large German force. This victory was a major turning point because Germany lost many soldiers and military resources. After Stalingrad, the Soviet army began to gain the advantage on the Eastern Front. Today, the battle is remembered for the bravery and suffering of those who fought there.\n\nYour museum visit sounds fascinating! Which exhibits did you see? Did you try any experiments? What did your brother enjoy most?\n\nLooking forward to your email.\n\nTake care,\nAndrey", "mechanic": 1}, {"id": 36, "title": "The First Human Space Flight (1961)", "friend": "Emma", "category": "Important Events in Russian History", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Emma.\n\nFrom: Emma To: Russian_friend Subject: Historic achievements\n\n...Our class is making a timeline of events that changed the world in the twentieth century. I'd like to include an important achievement from Russian history. Which event would you recommend? When did it happen and who was involved? Why was it important for the whole world? By the way, my friends and I are going to organise a second-hand book sale at school next week. We hope to raise money for our school library!\n\nWrite an email to Emma.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the book sale.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Emma,\n\nThank you for your email. It was wonderful to hear from you!\n\nThe twentieth century was full of important discoveries, and one event I'd recommend is the first human space flight. On 12 April 1961, Soviet cosmonaut Yuri Gagarin became the first person to travel into space. He flew around the Earth in the Vostok 1 spacecraft, and his journey lasted about 108 minutes. This achievement showed that humans could travel beyond our planet. Moreover, it opened a new chapter in space exploration and inspired people around the world. In Russia, 12 April is celebrated as Cosmonautics Day.\n\nI like your idea of a book sale! What kinds of books will you sell? Where will the sale take place? How will you advertise it?\n\nWrite back soon.\n\nBest wishes,\nVera", "mechanic": 2}, {"id": 37, "title": "Russian Cuisine", "friend": "Charlotte", "category": "Russian Traditions and Customs", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Charlotte.\n\nFrom: Charlotte To: Russian_friend Subject: Traditional food\n\n...We're learning about traditional dishes from different countries in our English lessons. I'd love to find out more about Russian food. What traditional Russian dish would you recommend trying? What ingredients are used to make it? How is this dish usually served? By the way, I went to a pottery class with my aunt last Saturday. We made some things out of clay!\n\nWrite an email to Charlotte.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the pottery class.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Charlotte,\n\nThanks for your email. It was great to hear from you!\n\nRussian cuisine has many delicious dishes, and I'd recommend trying pelmeni, which are small pieces of dough filled with minced meat. They're a popular traditional dish in Russia. To make them, you need flour, water, eggs, minced meat, onions and some salt. First, you prepare the dough and the filling. Then you put small amounts of meat inside pieces of dough and close them carefully. Pelmeni are usually boiled in water and served hot with sour cream or butter. They're especially popular during the colder months.\n\nI'd love to know more about your pottery class! What did you make? Was it difficult to work with clay? Did you paint your finished pieces?\n\nWrite back soon.\n\nBest wishes,\nYulia", "mechanic": 0}, {"id": 38, "title": "Khokhloma Painting", "friend": "Benjamin", "category": "Russian Traditions and Customs", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Benjamin.\n\nFrom: Benjamin To: Russian_friend Subject: Traditional crafts\n\n...Our art teacher has asked us to prepare short talks about traditional crafts from different countries. I'd like to choose something from Russia. Which Russian craft would you recommend? What do the objects made using this craft look like? Why is this craft special? By the way, our school is organising a talent show next month. I've decided to take part!\n\nWrite an email to Benjamin.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about the talent show.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Benjamin,\n\nThank you for your email. It was lovely to hear from you!\n\nI'd recommend Khokhloma, a traditional Russian style of painting wooden objects. People use it to decorate bowls, spoons and other household items. Khokhloma objects often have red, black and gold patterns. For example, you can see flowers, leaves and berries painted on them. What makes this craft special is that the objects look as if they are decorated with gold, although no real gold is used. This tradition is hundreds of years old and remains popular. I think these colourful objects would look beautiful in any home.\n\nIt's interesting that you're taking part in the talent show! What are you going to perform? Will you perform alone or with friends? How long will your performance be?\n\nHope to hear from you soon.\n\nAll the best,\nStepan", "mechanic": 1}, {"id": 39, "title": "Orenburg Down Shawls", "friend": "Olivia", "category": "Russian Traditions and Customs", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Olivia.\n\nFrom: Olivia To: Russian_friend Subject: Handmade traditions\n\n...We're preparing an exhibition about traditional handmade items from around the world. I'd like to include something unusual from Russia. What traditional Russian handmade item would you suggest? What is it made from? Why is it famous? By the way, I visited a butterfly house with my little sister last weekend. We saw lots of beautiful butterflies!\n\nWrite an email to Olivia.\n\nIn your message:\n\n- answer her questions;\n- ask 3 questions about the butterfly house visit.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Olivia,\n\nThanks a lot for your email. It was nice to hear from you!\n\nI'm happy to tell you about Russian handicrafts. I'd recommend an Orenburg down shawl. It's made from fine goat down, the soft hair of goats. These shawls are usually knitted by hand and can have beautiful patterns. They're famous for being very warm, light and soft. Some are so fine that they can pass through a ring! This tradition comes from Russia's Orenburg region and spans generations. I think an Orenburg shawl would be an interesting item for your exhibition.\n\nYour visit to the butterfly house must have been lovely! How many different kinds of butterflies did you see? Did any butterflies land on you? Did you take any photographs?\n\nLooking forward to your email.\n\nTake care,\nLidia", "mechanic": 2}, {"id": 40, "title": "Russian Hospitality", "friend": "Daniel", "category": "Russian Traditions and Customs", "task": "Task 37\n\nYou have received an email message from your English-speaking pen-friend Daniel.\n\nFrom: Daniel To: Russian_friend Subject: Customs and traditions\n\n...In our English lessons, we're discussing how people welcome guests in different countries. I'd like to learn about Russian customs. How do Russian people usually welcome guests into their homes? What food or drinks do they often offer? Why is hospitality important in Russian culture? By the way, my family is going to move to a new flat next month. We're already packing our things!\n\nWrite an email to Daniel.\n\nIn your message:\n\n- answer his questions;\n- ask 3 questions about moving to the new flat.\n\nWrite 100–140 words. Remember the rules of email writing.", "answer": "Dear Daniel,\n\nThank you for your email. It was great to hear from you!\n\nHospitality is important in Russian culture, with several traditions for welcoming guests. When friends or relatives visit, people usually greet them warmly and invite them inside. They often offer tea, biscuits, sweets or homemade food. For example, guests might be invited to share a meal with the family. In many Russian homes, it's considered polite to make visitors feel comfortable and welcome. I think hospitality is important because it helps people build strong relationships and show kindness to one another. Of course, every family has its own habits and traditions.\n\nMoving to a new flat is a big event! How far is it from your old home? Will you have your own room? Who will help you move?\n\nWrite back soon.\n\nBest wishes,\nArina", "mechanic": 0}];
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=$('groups'),overlay=$('overlay');
let state=null;
for(const category of [...new Set(DATA.map(d=>d.category))]){
 const section=document.createElement('section');section.className='group';
 const h=document.createElement('h2');h.textContent=category;section.append(h);
 const grid=document.createElement('div');grid.className='cards';
 for(const d of DATA.filter(x=>x.category===category)){
  const b=document.createElement('button');b.className='topic';b.textContent=d.title;b.addEventListener('click',()=>openTask(d));grid.append(b);
 }
 section.append(grid);groups.append(section);
}
function examHTML(task){
 const lines=task.replace(/^Task 37\n\n/,'').split('\n\n');let result='';
 for(const block of lines){
  if(block.startsWith('From: ')){
   const m=block.match(/^From: (.*?) To: (.*?) Subject: (.*)$/);
   result+=m?`<div class="meta"><strong>From:</strong> <strong>${escapeHTML(m[1])}</strong><br><strong>To:</strong> <strong>${escapeHTML(m[2])}</strong><br><strong>Subject:</strong> <strong>${escapeHTML(m[3])}</strong></div>`:`<p>${escapeHTML(block)}</p>`;
  }else if(block.startsWith('...')) result+=`<p class="incoming">${escapeHTML(block)}</p>`;
  else if(block.startsWith('- '))result+=`<ul class="requirements">${block.split('\n').map(l=>`<li>${escapeHTML(l.slice(2)).replace(/ask 3 questions/i,m=>'<strong>'+m+'</strong>')}</li>`).join('')}</ul>`;
  else if(block.startsWith('Write 100'))result+=`<p><strong>${escapeHTML(block)}</strong></p>`;
  else result+=`<p>${escapeHTML(block)}</p>`;
 }
 return result;
}
function openTask(d){
 state={d,type:(d.id-1)%3};$('modal-title').textContent=d.title;$('exam').innerHTML=examHTML(d.task);$('feedback').textContent='';
 overlay.classList.add('open');document.body.style.overflow='hidden';$('modal').scrollTop=0;
 if(state.type===0)startOrder();else if(state.type===1)startReveal();else startBank();
}
function closeTask(){overlay.classList.remove('open');document.body.style.overflow='';state=null;}
$('close').addEventListener('click',closeTask);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeTask()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state)closeTask()});
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function paragraphs(answer){return answer.split(/\n\n/).filter(Boolean)}
function startOrder(){
 $('instruction').textContent='Use the arrows to arrange the parts of the email in the correct order.';
 const parts=paragraphs(state.d.answer);state.parts=parts;state.order=shuffle(parts.map((_,i)=>i));
 if(state.order.every((x,i)=>x===i)&&parts.length>1)state.order.reverse();
 $('activity').innerHTML='<div class="order-list" id="order-list"></div><div class="controls"><button class="action" id="check">Check My Answer</button><button class="action secondary" id="reset">Try Again</button></div>';
 $('check').onclick=checkOrder;$('reset').onclick=startOrder;renderOrder();
}
function renderOrder(){const list=$('order-list');list.innerHTML='';
 state.order.forEach((idx,pos)=>{
  const card=document.createElement('div');card.className='order-card';
  const t=document.createElement('div');t.className='order-text';t.textContent=state.parts[idx];card.append(t);
  const arrows=document.createElement('div');arrows.className='arrows';
  for(const [direction,label] of [[-1,'↑'],[1,'↓']]){
   const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',direction<0?'Move up':'Move down');b.disabled=pos+direction<0||pos+direction>=state.order.length;
   b.onclick=()=>{const other=pos+direction;[state.order[pos],state.order[other]]=[state.order[other],state.order[pos]];$('feedback').textContent='';renderOrder()};arrows.append(b);
  }card.append(arrows);list.append(card);
 });
}
function checkOrder(){let correct=0;document.querySelectorAll('.order-card').forEach((card,i)=>{const yes=state.order[i]===i;card.classList.toggle('correct',yes);if(yes)correct++});$('feedback').textContent=correct===state.order.length?'🎉 Perfect! The email is in the correct order.':`${correct} of ${state.order.length} parts are in the correct position. Keep going!`}
// Reveal exactly ten context-guessable words, distributed across the whole letter.
const REVEAL_WORDS=new Set(['thanks','thank','email','message','great','lovely','nice','hear','happy','glad','write','back','soon','best','wishes','take','care','looking','forward','reply','favourite','school','painting','books','holiday','visit','friends','family','interesting','important','famous','enjoy','hope','artist','artists','museum','poetry','poet','writer','novel','story','stories','science','scientist','people','music','travel','country','city','learn','love','beautiful','wonderful','exciting','questions','russian','traditional','often','many','which','where','what','when','your','about','would','like','think','really','also','most','some','much','tell','known','work','works','time','first','different','special','celebrate','celebrated','history','reading','painted','paintings']);
const FIXED_GAPS={"2":[18,50,52,62,88,94,108,156,214,236],"3":[4,36,54,72,86,110,132,168,182,224],"5":[44,72,96,98,110,122,196,204,234,244],"6":[4,44,70,94,118,136,152,178,200,236],"8":[56,60,84,92,100,104,122,134,176,238],"9":[4,42,48,84,130,144,158,178,206,236],"11":[46,60,76,90,100,122,128,170,226,248],"12":[4,38,40,44,58,78,102,142,176,210],"14":[50,54,58,70,78,98,106,126,186,190],"15":[4,44,60,76,90,104,124,142,164,192],"17":[46,50,62,74,76,88,124,126,148,212],"18":[4,46,68,88,116,132,158,176,190,214],"20":[40,50,60,74,76,82,92,126,196,234],"21":[4,40,42,62,110,138,166,196,216,252],"23":[38,60,66,70,72,124,126,162,248,262],"24":[4,46,72,92,96,116,178,200,224,254],"26":[48,62,70,82,104,142,146,160,210,234],"27":[16,44,60,86,114,132,156,180,202,246],"29":[36,60,66,86,90,116,126,192,198,238],"30":[4,42,80,96,126,134,152,180,218,248],"32":[32,42,70,78,106,112,160,166,218,236],"33":[4,38,66,84,114,144,164,188,212,238],"35":[38,68,76,86,114,118,156,176,228,252],"36":[18,42,62,68,84,88,110,176,212,238],"38":[44,58,68,86,88,100,106,122,186,256],"39":[4,56,78,88,110,148,162,180,200,220]};
function selectTokens(answer,mode){
 const chunks=answer.match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g)||[];
 const paragraphs=[];let para=0;
 chunks.forEach((chunk,i)=>{if(/^[A-Za-z]{3,}$/.test(chunk)){
  if(!paragraphs[para])paragraphs[para]=[];
  paragraphs[para].push(i);
 }para+=(chunk.match(/\n\n/g)||[]).length;});
 const selected=[];
 function pick(indices,count){
  if(!indices||!indices.length||count<=0)return;
  const eligible=indices.filter(i=>!selected.includes(i));
  const groups=[];let group=[];
  for(const i of eligible){
   if(group.length && /[.!?]/.test(chunks.slice(group[group.length-1]+1,i).join(''))){groups.push(group);group=[];}
   group.push(i);
  }
  if(group.length)groups.push(group);
  // Pick from evenly spaced sentences first; prefer familiar, easy-to-infer words.
  const sentenceTargets=[];
  const n=Math.min(count,groups.length);
  for(let k=0;k<n;k++)sentenceTargets.push(groups[Math.min(groups.length-1,Math.floor((k+.5)*groups.length/n))]);
  for(const g of sentenceTargets){
   const preferred=g.filter(i=>REVEAL_WORDS.has(chunks[i].toLowerCase()) && chunks[i].length>=4);
   const pool=preferred.length?preferred:g;
   selected.push(pool[Math.floor(pool.length/2)]);
  }
  // For long body paragraphs with fewer sentences, space additional gaps by word position.
  while(selected.filter(i=>indices.includes(i)).length<Math.min(count,indices.length)){
   const remaining=indices.filter(i=>!selected.includes(i));
   if(!remaining.length)break;
   const familiar=remaining.filter(i=>REVEAL_WORDS.has(chunks[i].toLowerCase()));
   const pool=familiar.length?familiar:remaining;
   let best=pool[0],bestDist=-1;
   for(const i of pool){
    const existing=selected.filter(j=>indices.includes(j));
    const distance=existing.length?Math.min(...existing.map(j=>Math.abs(i-j))):Infinity;
    if(distance>bestDist){best=i;bestDist=distance;}
   }
   selected.push(best);
  }
 }
 // Introduction 1, body 6, questions 2, sign-off sentence 1. Never hide the signature name.
 pick(paragraphs[1],1);pick(paragraphs[2],6);pick(paragraphs[3],2);pick(paragraphs[4],1);
 // Support any unusual paragraph structure while keeping exactly ten gaps.
 if(selected.length<10){
  const pool=paragraphs.slice(1,-1).flat().filter(i=>!selected.includes(i));
  pick(pool,10-selected.length);
 }
 return {chunks,chosen:selected.slice(0,10).sort((a,b)=>a-b)};
}
function startReveal(){
 $('instruction').textContent='Say the missing word, then click ? to reveal it.';
 const chunks=state.d.answer.match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g)||[];const chosen=FIXED_GAPS[state.d.id];state.reveal={chunks,chosen,seen:new Set()};
 $('activity').innerHTML='<div class="sample-box" id="answer-text"></div><div class="progress"><span id="progress-label"></span><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div><div class="controls"><button class="action secondary" id="reset">Try Again</button></div>';
 $('reset').onclick=startReveal;renderReveal();
}
function renderReveal(){const {chunks,chosen,seen}=state.reveal;const box=$('answer-text');box.innerHTML='';let para=document.createElement('p');box.append(para);
 chunks.forEach((chunk,i)=>{
  if(chunk.includes('\n\n')){
   const split=chunk.split(/(\n\n)/);
   for(const part of split){if(part==='\n\n'){para=document.createElement('p');box.append(para)}else para.append(document.createTextNode(part))}return;
  }
  if(chosen.includes(i)){
   if(seen.has(i)){const word=document.createElement('span');word.className='revealed-word';word.textContent=chunk;para.append(word)}
   else{const gap=document.createElement('span');gap.className='gap';gap.textContent=chunk[0]+'_'.repeat(Math.max(2,chunk.length-1));para.append(gap);const b=document.createElement('button');b.className='reveal';b.textContent='?';b.setAttribute('aria-label','Reveal missing word');b.onclick=()=>{seen.add(i);renderReveal()};para.append(b)}
  }else para.append(document.createTextNode(chunk));
 });
 $('progress-label').textContent=`${seen.size} / ${chosen.length} revealed`;$('progress-fill').style.width=(chosen.length?100*seen.size/chosen.length:100)+'%';
 if(chosen.length&&seen.size===chosen.length)$('feedback').textContent='🎉 All words revealed!';
}
function startBank(){
 $('instruction').textContent='Choose a word above, then tap the matching gap in the email.';
 const chunks=state.d.answer.match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g)||[];
 const chosen=FIXED_GAPS[state.d.id];
 state.bank={chunks,chosen,words:shuffle(chosen.map((i,n)=>({id:n,text:chunks[i]}))),filled:{},selected:null};
 $('activity').innerHTML='<div class="bank"><div class="bank-words" id="bank-words"></div></div><div class="sample-box" id="answer-text"></div><div class="controls"><button class="action" id="check">Check My Answer</button><button class="action secondary" id="reset">Try Again</button></div>';
 $('check').onclick=checkBank;$('reset').onclick=startBank;renderBank();
}
function renderBank(){const b=state.bank;const words=$('bank-words');words.innerHTML='';
 b.words.forEach(w=>{const button=document.createElement('button');button.className='word';button.textContent=w.text;button.classList.toggle('used',Object.values(b.filled).includes(w.id));button.classList.toggle('selected',b.selected===w.id);button.onclick=()=>{b.selected=w.id;renderBank()};words.append(button)});
 const box=$('answer-text');box.innerHTML='';let para=document.createElement('p');box.append(para);
 b.chunks.forEach((chunk,i)=>{
  if(chunk.includes('\n\n')){for(const part of chunk.split(/(\n\n)/)){if(part==='\n\n'){para=document.createElement('p');box.append(para)}else para.append(document.createTextNode(part))}return}
  const gapIndex=b.chosen.indexOf(i);
  if(gapIndex<0){para.append(document.createTextNode(chunk));return}
  const button=document.createElement('button');button.className='inline-gap';const word=b.words.find(w=>w.id===b.filled[gapIndex]);button.textContent=word?word.text:'______';button.classList.toggle('filled',!!word);button.setAttribute('aria-label','Gap '+(gapIndex+1));button.onclick=()=>{
   if(b.selected!==null){const previous=Object.keys(b.filled).find(k=>b.filled[k]===b.selected);if(previous!==undefined)delete b.filled[previous];b.filled[gapIndex]=b.selected;b.selected=null}
   else if(word)delete b.filled[gapIndex];$('feedback').textContent='';renderBank()
  };para.append(button);
 });
}
function checkBank(){const b=state.bank;let correct=0;b.chosen.forEach((idx,k)=>{const id=b.filled[k];const word=b.words.find(w=>w.id===id);if(word&&word.text.toLowerCase()===b.chunks[idx].toLowerCase())correct++});$('feedback').textContent=correct===b.chosen.length?'🎉 Perfect! All words are correct.':`${correct} of ${b.chosen.length} words are correct. Try again!`;
 document.querySelectorAll('.inline-gap').forEach((el,k)=>{const id=b.filled[k],word=b.words.find(w=>w.id===id);el.classList.toggle('wrong',!!word&&word.text.toLowerCase()!==b.chunks[b.chosen[k]].toLowerCase())});
}

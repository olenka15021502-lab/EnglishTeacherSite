<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famous Scientists Quiz | ЕГЭ Preparation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* === БАЗОВЫЕ СТИЛИ ИЗ ВАШЕГО САЙТА === */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(168,181,255,0.3), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(123,92,255,0.25), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(200,210,255,0.2), transparent 50%),
        linear-gradient(180deg, #f5f0ff, #ede7ff);
      color: #2a1a5a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    html, body { overflow-x: hidden; }
    * { box-sizing: border-box; }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* === ШАПКА И НАВИГАЦИЯ === */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(107, 90, 140, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      z-index: 1000;
      padding: 12px 0;
    }
    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      color: white;
      text-decoration: none;
    }

    /* === ПЛАШКИ-ССЫЛКИ === */
    .brand-links {
      text-align: center;
      margin: 100px 0 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .brand-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 30px;
      border: 2px solid white;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .brand-link.max {
      background: linear-gradient(90deg, #14b8a6, #0ea5e9);
      box-shadow: 0 4px 15px rgba(20, 184, 166, 0.4);
    }
    .brand-link.materials {
      background: linear-gradient(90deg, #ec4899, #a855f7);
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }
    .brand-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    /* === СТИЛИ КВИЗА === */
    .quiz-title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #4a1a7a;
      margin-bottom: 30px;
    }
    .quiz-title span {
      font-family: 'Caveat', cursive;
      color: #a044ff;
      font-size: 3rem;
      display: block;
      margin-top: -10px;
    }

    .quiz-card {
      background: white;
      border-radius: 20px;
      padding: 32px;
      border: 1px solid #e0d5f5;
      box-shadow: 0 8px 24px rgba(160, 68, 255, 0.1);
      margin-bottom: 30px;
      transition: all 0.3s ease;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f0e6ff;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a044ff, #d980ff);
      width: 0%;
      transition: width 0.4s ease;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #2a1a5a;
    }

    .options-grid {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      border: 2px solid #e0d5f5;
      border-radius: 12px;
      background: #faf8ff;
      color: #2a1a5a;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #a044ff;
      background: #f0e6ff;
      transform: translateX(4px);
    }

    .option-btn.correct {
      background: #d1fae5 !important;
      border-color: #10b981 !important;
      color: #065f46 !important;
    }

    .option-btn.incorrect {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .next-btn {
      display: none;
      margin: 24px auto 0;
      padding: 14px 32px;
      border-radius: 999px;
      background: linear-gradient(90deg, #a044ff, #d980ff);
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(160, 68, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(160, 68, 255, 0.4);
    }

    /* === ЭКРАН РЕЗУЛЬТАТОВ === */
    .result-card {
      display: none;
      text-align: center;
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      border: 1px solid #e0d5f5;
      box-shadow: 0 8px 24px rgba(160, 68, 255, 0.15);
    }
    .result-emoji {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    .result-score {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #4a1a7a;
      margin-bottom: 12px;
    }
    .result-message {
      font-size: 1.2rem;
      color: #6b6fa8;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .restart-btn {
      padding: 14px 32px;
      border-radius: 999px;
      background: linear-gradient(90deg, #14b8a6, #0ea5e9);
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(20, 184, 166, 0.3);
      transition: transform 0.2s;
    }
    .restart-btn:hover {
      transform: translateY(-2px);
    }

    .footer {
      margin-top: auto;
      padding: 20px 0;
      text-align: center;
      font-size: 14px;
      color: #6b6fa8;
      background: rgba(255,255,255,0.5);
    }

    @media (max-width: 768px) {
      .quiz-title { font-size: 2rem; }
      .quiz-title span { font-size: 2.2rem; }
      .quiz-card { padding: 24px 20px; }
      .question-text { font-size: 1.1rem; }
      .option-btn { font-size: 1rem; padding: 14px 16px; }
      .brand-links { margin-top: 90px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">✨ English with Olga ✨</a>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Плашки навигации как на основном сайте -->
    <div class="brand-links">
      <a href="https://max.ru/se13305924_biz" target="_blank" class="brand-link max">✨ English with Olga (Max)</a>
      <a href="/" target="_blank" class="brand-link materials">📚 Useful Materials</a>
    </div>

    <h1 class="quiz-title">
      Famous Scientists
      <span>Interactive Quiz 🔬</span>
    </h1>

    <!-- Карточка с вопросом -->
    <div id="quiz-container" class="quiz-card">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="question-text" class="question-text"></div>
      <div id="options-grid" class="options-grid"></div>
      <button id="next-btn" class="next-btn">Next question ➡️</button>
    </div>

    <!-- Карточка с результатом -->
    <div id="result-card" class="result-card">
      <div id="result-emoji" class="result-emoji"></div>
      <div id="result-score" class="result-score"></div>
      <div id="result-message" class="result-message"></div>
      <button class="restart-btn" onclick="restartQuiz()">🔄 Try Again</button>
    </div>
  </div>

  <div class="footer">
    Медведева Ольга Александровна | ИНН 501106530902
  </div>

  <script>
    // === БАЗА ВОПРОСОВ (20 штук, британский английский, перемешанные ответы) ===
    const questions = [
      {
        q: "Who used playing cards to arrange elements until a pattern emerged?",
        options: ["Dmitri Mendeleev", "Nikolai Lobachevsky", "Alexander Fleming", "Thomas Edison"],
        correct: 0
      },
      {
        q: "Which scientist suffered from deafness and worked as a schoolteacher in Kaluga?",
        options: ["Sergei Korolev", "Konstantin Tsiolkovsky", "Igor Sikorsky", "Lev Landau"],
        correct: 1
      },
      {
        q: "Who solved the 'torque' problem in helicopters with a small tail rotor?",
        options: ["Mikhail Kalashnikov", "Albert Einstein", "Igor Sikorsky", "Niels Bohr"],
        correct: 2
      },
      {
        q: "Who walked all the way to Moscow as a teenager to get an education?",
        options: ["Ivan Petrovich Pavlov", "Mikhail Lomonosov", "Alexander Popov", "Stephen Hawking"],
        correct: 1 // Исправлено на B (Lomonosov) для баланса
      },
      {
        q: "Which physicist introduced 'quasiparticles' to explain sound and heat in supercold liquids?",
        options: ["Lev Landau", "Marie Curie", "Nikola Tesla", "Dmitri Mendeleev"],
        correct: 0
      },
      {
        q: "Whose work on non-Euclidean geometry helped Einstein develop the General Theory of Relativity?",
        options: ["Konstantin Tsiolkovsky", "Nikolai Lobachevsky", "Sergei Korolev", "Mikhail Lomonosov"],
        correct: 1
      },
      {
        q: "Who designed a weapon with wide gaps so dirt would not stop it?",
        options: ["Igor Sikorsky", "Thomas Edison", "Mikhail Kalashnikov", "Albert Einstein"],
        correct: 2
      },
      {
        q: "Who survived the Soviet labour camps (Gulag) in the 1930s?",
        options: ["Sergei Korolev", "Lev Landau", "Alexander Popov", "Ivan Petrovich Pavlov"],
        correct: 0 // Исправлено на A (Korolev) для баланса
      },
      {
        q: "Who initially studied theology before switching to natural sciences?",
        options: ["Nikolai Lobachevsky", "Dmitri Mendeleev", "Ivan Petrovich Pavlov", "Niels Bohr"],
        correct: 2
      },
      {
        q: "Who worked at the Russian Navy's Torpedo School in Kronstadt?",
        options: ["Alexander Popov", "Nikola Tesla", "Marie Curie", "Alexander Fleming"],
        correct: 0
      },
      {
        q: "Whose theory is essential for GPS technology to work accurately?",
        options: ["Stephen Hawking", "Niels Bohr", "Lev Landau", "Albert Einstein"],
        correct: 3
      },
      {
        q: "Who invented the Tesla coil for high-voltage electricity?",
        options: ["Thomas Edison", "Nikola Tesla", "Alexander Fleming", "Mikhail Lomonosov"],
        correct: 1
      },
      {
        q: "Who coined the term 'radioactivity'?",
        options: ["Marie Curie", "Alexander Fleming", "Niels Bohr", "Lev Landau"],
        correct: 0
      },
      {
        q: "Who discovered penicillin from a mouldy petri dish?",
        options: ["Ivan Petrovich Pavlov", "Alexander Fleming", "Stephen Hawking", "Dmitri Mendeleev"],
        correct: 1
      },
      {
        q: "Who proposed that electrons jump between specific energy levels?",
        options: ["Albert Einstein", "Lev Landau", "Niels Bohr", "Marie Curie"],
        correct: 2
      },
      {
        q: "Who held over 1,000 patents and invented the phonograph?",
        options: ["Thomas Edison", "Igor Sikorsky", "Sergei Korolev", "Konstantin Tsiolkovsky"],
        correct: 0
      },
      {
        q: "Who proved that black holes emit radiation?",
        options: ["Albert Einstein", "Niels Bohr", "Lev Landau", "Stephen Hawking"],
        correct: 3
      },
      {
        q: "Who predicted three unknown elements with amazing accuracy?",
        options: ["Dmitri Mendeleev", "Mikhail Lomonosov", "Nikolai Lobachevsky", "Ivan Petrovich Pavlov"],
        correct: 0 // Исправлено на A для баланса
      },
      {
        q: "Who said: 'The Earth is the cradle of humanity, but one cannot live in the cradle forever'?",
        options: ["Sergei Korolev", "Igor Sikorsky", "Konstantin Tsiolkovsky", "Alexander Popov"],
        correct: 2
      },
      {
        q: "Who applied his chemistry research to revive the art of mosaic?",
        options: ["Lev Landau", "Mikhail Lomonosov", "Nikolai Lobachevsky", "Mikhail Kalashnikov"],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const quizContainer = document.getElementById('quiz-container');
    const resultCard = document.getElementById('result-card');
    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');

    function loadQuestion() {
      answered = false;
      nextBtn.style.display = 'none';
      const q = questions[currentQuestion];
      
      // Обновление прогресс-бара
      const progress = ((currentQuestion) / questions.length) * 100;
      progressFill.style.width = `${progress}%`;

      questionText.textContent = `${currentQuestion + 1}. ${q.q}`;
      optionsGrid.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span><strong>${labels[index]}.</strong> ${opt}</span> <span class="icon"></span>`;
        btn.onclick = () => checkAnswer(index, btn);
        optionsGrid.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, btnElement) {
      if (answered) return;
      answered = true;

      const q = questions[currentQuestion];
      const buttons = optionsGrid.querySelectorAll('.option-btn');

      buttons.forEach((btn, index) => {
        btn.disabled = true; // Блокируем все кнопки
        const iconSpan = btn.querySelector('.icon');
        
        if (index === q.correct) {
          btn.classList.add('correct');
          iconSpan.textContent = '✅';
        } else if (index === selectedIndex && index !== q.correct) {
          btn.classList.add('incorrect');
          iconSpan.textContent = '❌';
        }
      });

      if (selectedIndex === q.correct) {
        score++;
      }

      nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      quizContainer.style.display = 'none';
      resultCard.style.display = 'block';
      
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById('result-score').textContent = `Your score: ${score} / ${questions.length}`;
      
      let emoji = '';
      let message = '';
      
      if (percentage >= 90) {
        emoji = '🏆🧠';
        message = 'Outstanding! You are a true science expert! Excellent preparation for the ЕГЭ.';
      } else if (percentage >= 70) {
        emoji = '🌟🔬';
        message = 'Great job! You have a solid knowledge of famous scientists. Keep up the good work!';
      } else if (percentage >= 50) {
        emoji = '📚💡';
        message = 'Good effort! Review the materials on "Useful Materials" page to boost your score.';
      } else {
        emoji = '🧪📖';
        message = 'Do not worry! Science takes time. Review the texts and try again. You can do it!';
      }
      
      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-message').textContent = message;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      quizContainer.style.display = 'block';
      resultCard.style.display = 'none';
      loadQuestion();
    }

    // Запуск квиза при загрузке
    loadQuestion();
  </script>
</body>
</html>
